
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMA AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <aside class="sidebar">
            <h2 class="logo">
    <span class="planet-logo">◉</span>
    COSMA AI
</h2>
            <p class="tagline">Your AI. Your Universe.</p>

            <button class="new-chat">+ New Chat</button>

            <div class="sidebar-bottom">
                <p>AI Assistant</p>
                <p>Version 1.0</p>
            </div>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <span>General Assistant</span>
                <span class="status">● Online</span>
            </header>

            <section class="welcome">
               <div class="cosmic-icon">
    <span class="planet-logo">◉</span>
</div>
                <h1>Explore your universe.</h1>
                <p>I'm COSMA, your personal AI assistant.</p>
                <p class="subtext">Ask questions, explore ideas, and learn something new.</p>
            </section>

            <div class="chat-area" id="chatArea"></div>

            <div class="input-area">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Ask COSMA anything..."
                >
                <button id="sendButton">➤</button>
            </div>

            <p class="footer-text">COSMA AI can make mistakes. Verify important information.</p>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
